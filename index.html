<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroWaste IT — Automated SaaS Spend & Shadow AI Audit</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #121826;
      --surface-2: #1a2234;
      --border: #263147;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
      --danger: #ef4444;
      --warning: #f59e0b;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); line-height: 1.5; }

    nav {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
      padding: 18px 6%; border-bottom: 1px solid var(--border);
      background: rgba(11, 15, 23, 0.92); position: sticky; top: 0; z-index: 40; backdrop-filter: blur(8px);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; letter-spacing: -0.02em; }
    .brand-badge { background: var(--accent); color: #042f2e; font-weight: 800; padding: 3px 8px; border-radius: 6px; font-size: 0.85rem; }
    .nav-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .nav-link { color: var(--muted); text-decoration: none; font-size: 0.88rem; font-weight: 600; padding: 6px 10px; transition: 0.15s; }
    .nav-link:hover { color: var(--text); }
    .user-chip {
      font-size: 0.8rem; color: var(--accent); background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3); padding: 5px 11px; border-radius: 999px;
    }

    .upgrade-banner {
      display: none; background: rgba(16, 185, 129, 0.16); border-bottom: 1px solid rgba(16, 185, 129, 0.45);
      color: #a7f3d0; padding: 12px 6%; text-align: center; font-size: 0.9rem; font-weight: 600;
    }
    .upgrade-banner.open { display: flex; justify-content: center; align-items: center; gap: 14px; }

    .btn {
      padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
      cursor: pointer; border: 1px solid transparent; transition: all 0.15s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: #042f2e; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-outline { background: transparent; border-color: var(--border); color: var(--text); }
    .btn-outline:hover { background: var(--surface-2); }
    .btn-danger-outline { background: transparent; border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }
    .btn-danger-outline:hover { background: rgba(239, 68, 68, 0.12); }
    .btn-sm { padding: 6px 11px; font-size: 0.78rem; }
    .btn-block { width: 100%; }

    .hero { padding: 56px 6% 36px; max-width: 1200px; margin: 0 auto; text-align: center; }
    .pill {
      display: inline-block; padding: 5px 14px; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
      background: rgba(16, 185, 129, 0.12); color: var(--accent); border: 1px solid rgba(16, 185, 129, 0.3); margin-bottom: 18px;
    }
    .hero h1 { font-size: clamp(2.1rem, 4vw, 3.2rem); font-weight: 800; letter-spacing: -0.03em; max-width: 850px; margin: 0 auto 16px; line-height: 1.15; }
    .hero p { color: var(--muted); font-size: 1.08rem; max-width: 680px; margin: 0 auto 26px; }
    .hero-cta { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

    .container { max-width: 1200px; margin: 0 auto 72px; padding: 0 6%; }
    .dashboard-shell {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .dash-topbar {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;
      padding: 16px 24px; background: var(--surface-2); border-bottom: 1px solid var(--border);
    }
    .dash-title { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 0.95rem; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .dash-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; padding: 24px; }
    .kpi-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
    .kpi-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
    .kpi-val { font-size: 1.85rem; font-weight: 800; letter-spacing: -0.02em; }
    .kpi-sub { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    .val-green { color: var(--accent); }
    .val-red { color: var(--danger); }
    .val-amber { color: var(--warning); }

    .tabs { display: flex; gap: 8px; padding: 0 24px; border-bottom: 1px solid var(--border); }
    .tab {
      padding: 12px 16px; font-size: 0.9rem; font-weight: 600; color: var(--muted); cursor: pointer;
      border-bottom: 2px solid transparent; transition: 0.15s;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .table-wrap { padding: 20px 24px 28px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    td { padding: 14px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .action-cell { display: flex; gap: 8px; flex-wrap: wrap; }

    .user-drawer-row td { background: var(--bg); padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .user-drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .user-drawer-header span { font-size: 0.82rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; }
    .sub-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
    .sub-table th { padding: 7px 10px; font-size: 0.72rem; border-bottom: 1px solid var(--border); }
    .sub-table td { padding: 8px 10px; border-bottom: 1px solid rgba(38, 49, 71, 0.5); }
    .sub-table tr:last-child td { border-bottom: none; }

    .badge { padding: 3px 9px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
    .badge-high { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }
    .badge-med { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35); }
    .badge-low { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.35); }

    /* Pricing Section */
    .pricing-section { max-width: 1200px; margin: 0 auto 90px; padding: 20px 6% 0; }
    .pricing-header { text-align: center; max-width: 660px; margin: 0 auto 40px; }
    .pricing-header h2 { font-size: clamp(1.75rem, 3vw, 2.3rem); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; }
    .pricing-header p { color: var(--muted); font-size: 1rem; }
    .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 22px; align-items: stretch; }
    .plan-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px;
      display: flex; flex-direction: column; justify-content: space-between; position: relative;
    }
    .plan-card.featured {
      border-color: var(--accent); box-shadow: 0 20px 50px rgba(16, 185, 129, 0.14);
